<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --panel: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.1);
    --text: #e8eaf6;
    --muted: #90a4ae;
    --accent: #64b5f6;
    --warm: #ffb74d;
    --green: #81c784;
    --red: #e57373;
    --radius: 16px;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  /* ── Wallpaper background ── */
  #wallpaper {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 1.5s ease;
  }
  #wallpaper-next {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 1;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0.55) 0%,
      rgba(0,0,0,0.35) 40%,
      rgba(0,0,0,0.55) 100%
    );
  }

  /* ── Layout: single column, fits 1280×800 ── */
  #app {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: grid;
    grid-template-rows: 34vh 11vh 19vh 1fr;
    grid-template-columns: 1fr;
    gap: 8px;
    padding: 10px 14px;
  }

  /* ── Glass panel ── */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 16px 22px;
  }

  /* ── Row 1: Clock + Weather ── */
  #top-row {
    display: grid;
    grid-template-columns: 2fr 3fr;
    gap: 10px;
    align-items: stretch;
  }

  /* ── Clock ── */
  #clock-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    padding: 10px 16px;
    overflow: hidden;
  }
  #date {
    font-size: clamp(20px, 3.8vh, 34px);
    color: var(--accent);
    font-weight: 300;
    letter-spacing: 0.5px;
  }
  #time {
    font-size: clamp(52px, 10vh, 88px);
    font-weight: 200;
    letter-spacing: -3px;
    color: #fff;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #time-sep { animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #weekday {
    font-size: clamp(18px, 3vh, 28px);
    color: #cfd8dc;
    text-transform: uppercase;
    letter-spacing: 3px;
  }

  /* ── Weather ── */
  #weather-panel {
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 10px 20px;
    overflow: hidden;
    min-width: 0;
  }
  #weather-main {
    display: flex;
    align-items: stretch;
    gap: 18px;
  }
  /* Left: icon + hi/lo below */
  #weather-left {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #weather-icon { font-size: clamp(50px, 8vh, 72px); line-height: 1; }
  /* Right: temp + desc + feels */
  #weather-right {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    min-width: 0;
    overflow: hidden;
  }
  #weather-temp {
    font-size: clamp(36px, 5.5vh, 56px);
    font-weight: 200;
    color: #fff;
    line-height: 1.1;
    white-space: nowrap;
  }
  #weather-desc { font-size: clamp(14px, 2.2vh, 20px); color: var(--muted); }
  #weather-feels { font-size: clamp(13px, 2vh, 18px); color: var(--muted); white-space: nowrap; }
  #weather-details {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  #weather-hilo {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  #weather-hi { color: var(--warm); font-size: clamp(18px, 3.4vh, 44px); font-weight: 600; white-space: nowrap; }
  #weather-lo { color: var(--accent); font-size: clamp(18px, 3.4vh, 44px); white-space: nowrap; }
  #weather-icons {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .wd-item { color: var(--muted); font-size: clamp(14px, 2vh, 26px); white-space: nowrap; }
  .wd-item span { color: var(--text); font-weight: 500; }

  .fx-up { color: var(--green); }
  .fx-down { color: var(--red); }

  /* ── Market row ── */
  .market-grid {
    display: flex;
    align-items: center;
    flex: 1;
    justify-content: space-between;
    min-width: 0;
    overflow: hidden;
  }
  .market-stack {
    display: flex;
    flex-direction: column;
    gap: 4px;
    justify-content: center;
  }
  .market-item { display: flex; align-items: baseline; gap: 6px; flex-shrink: 1; min-width: 0; }
  .market-label {
    font-size: clamp(12px, 1.6vh, 17px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .market-value {
    font-size: clamp(16px, 2.4vh, 26px);
    font-weight: 300;
    color: #fff;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .market-change {
    font-size: clamp(11px, 1.5vh, 15px);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .market-change.up { color: var(--green); }
  .market-change.down { color: var(--red); }

  /* ── Row 2: Hourly precip chart ── */
  #precip-panel { padding: 6px 18px 8px; }
  #precip-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  #precip-chart {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: calc(13vh - 42px);
    border-bottom: 1px solid rgba(255,255,255,0.15);
    padding-bottom: 4px;
    position: relative;
  }
  .precip-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    gap: 2px;
  }
  .precip-bar {
    width: 100%;
    border-radius: 2px 2px 0 0;
    min-height: 4px;
  }
  .precip-label {
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    white-space: nowrap;
    line-height: 1;
    font-weight: 500;
  }

  /* ── Row 3: 7-day forecast ── */
  #forecast-panel { padding: 8px 18px; }
  #weather-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  #forecast {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .fc-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 4px 2px;
    border-right: 1px solid var(--border);
  }
  .fc-row:last-child { border-right: none; }
  .fc-day { color: var(--muted); font-size: clamp(12px, 1.8vh, 16px); font-weight: 600; }
  .fc-icon { font-size: clamp(20px, 3vh, 28px); }
  .fc-hi { color: var(--warm); font-weight: 600; font-size: clamp(13px, 1.9vh, 17px); }
  .fc-lo { color: var(--accent); font-size: clamp(12px, 1.7vh, 16px); }
  .fc-precip { display: flex; align-items: center; gap: 2px; color: var(--accent); font-size: clamp(11px, 1.6vh, 15px); }
  .fc-precip-num { font-variant-numeric: tabular-nums; }

  /* ── Row 4: News (3 stacked rows) ── */
  #news-panel {
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
  }
  .news-section {
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding: 3px 0;
    flex: 1;
  }
  .news-section:last-child { border-bottom: none; }
  .news-section-title {
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
    flex-shrink: 0;
    width: 110px;
  }
  .title-nyt    { color: #81c784; }
  .title-yonhap { color: #ffb74d; }
  .title-bbc    { color: #e57373; }
  .news-section-list { flex: 1; min-width: 0; transition: opacity 0.3s ease; }
  .news-item { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .news-headline {
    font-size: clamp(13px, 1.6vh, 17px);
    line-height: 1.4;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-time { display: none; }

  /* ── Wallpaper credit ── */
  #wp-credit {
    position: fixed;
    bottom: 8px; right: 12px;
    z-index: 3;
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    pointer-events: none;
  }

  /* scrollbar hide */
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<!-- Wallpaper layers -->
<div id="wallpaper"></div>
<div id="wallpaper-next"></div>
<div id="overlay"></div>

<!-- Main layout -->
<div id="app">

  <!-- Row 1: Clock + Weather + FX -->
  <div id="top-row">
    <div class="panel" id="clock-panel">
      <div id="date">Loading…</div>
      <div id="time"><span id="th">00</span><span id="time-sep">:</span><span id="tm">00</span></div>
      <div id="weekday"></div>
    </div>
    <div class="panel" id="weather-panel">
      <div id="weather-main">
        <div id="weather-left">
          <div id="weather-icon">⏳</div>
        </div>
        <div id="weather-right">
          <div id="weather-temp">--°</div>
          <div id="weather-desc">Loading weather…</div>
          <div id="weather-feels"></div>
        </div>
      </div>
      <div id="weather-details">
        <div id="weather-hilo">
          <div id="weather-hi"></div>
          <div id="weather-lo"></div>
        </div>
        <div id="weather-icons">
          <div class="wd-item">💧 <span id="w-hum">--</span>%</div>
          <div class="wd-item">💨 <span id="w-wind">--</span> mph</div>
          <div class="wd-item">👁 <span id="w-vis">--</span> mi</div>
          <div class="wd-item">☁️ <span id="w-cloud">--</span>%</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Row 2: 24h precip chart -->
  <div class="panel" id="precip-panel">
    <div id="precip-title">24-Hour Precipitation Probability</div>
    <div id="precip-chart"></div>
  </div>

  <!-- Row 3: 7-day forecast -->
  <div class="panel" id="forecast-panel">
    <div id="weather-section-title">7-Day Forecast</div>
    <div id="forecast"><div style="color:var(--muted);font-size:14px;">Loading…</div></div>
  </div>

  <!-- Row 3: News + FX -->
  <div class="panel" id="news-panel">
    <div class="news-section">
      <div class="news-section-title title-nyt">NYT</div>
      <div class="news-section-list" id="news-nyt"><span style="color:var(--muted);">Loading…</span></div>
    </div>
    <div class="news-section">
      <div class="news-section-title title-yonhap">Yonhap</div>
      <div class="news-section-list" id="news-yonhap"><span style="color:var(--muted);">Loading…</span></div>
    </div>
    <div class="news-section" style="border-bottom:none;">
      <div class="market-grid">
        <div class="market-item">
          <div class="market-label">USD→KRW</div>
          <div class="market-value" id="fx-KRW">--</div>
          <div class="market-change" id="fx-KRW-chg"></div>
        </div>
        <div class="market-stack">
          <div class="market-item">
            <div class="market-label" style="color:var(--green);">S&amp;P 500</div>
            <div class="market-value" id="mkt-sp500">--</div>
            <div class="market-change" id="mkt-sp500-chg"></div>
          </div>
          <div class="market-item">
            <div class="market-label" style="color:var(--red);">KOSPI</div>
            <div class="market-value" id="mkt-kospi">--</div>
            <div class="market-change" id="mkt-kospi-chg"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="wp-credit"></div>

<script>
// ════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════
const CFG = {
  lat: 40.7128, lon: -74.0060,   // New York City
  weatherRefresh: 30 * 60 * 1000,
  newsRefresh: 15 * 60 * 1000,
  wallpaperInterval: 5 * 60 * 1000,  // change wallpaper every 5 min
  rss2json: 'https://api.rss2json.com/v1/api.json?rss_url=',
  newsFeeds: [
    { id: 'nyt',    label: 'NYT',    badge: 'badge-nyt',    url: 'https://rss.nytimes.com/services/xml/rss/nyt/World.xml' },
    { id: 'yonhap', label: 'Yonhap', badge: 'badge-yonhap', url: 'https://en.yna.co.kr/RSS/news.xml' },
  ],
};

// Wallpaper sources — day (6:00~20:00) vs night (20:00~6:00)
const WALLPAPERS_DAY = [
  'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80',  // mountain lake
  'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&q=80',  // forest
  'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=1920&q=80',  // beach sunset
  'https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=1920&q=80',  // misty mountains
  'https://images.unsplash.com/photo-1448375240586-882707db888b?w=1920&q=80',  // forest path
  'https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=1920&q=80',  // wildflowers
  'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&q=80',  // beach turquoise
  'https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=1920&q=80',  // city day
  'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1920&q=80',  // green countryside
  'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1920&q=80',  // bright nature
  'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1920&q=80',  // aerial green landscape
  'https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=1920&q=80',  // sunlit forest
];
const WALLPAPERS_NIGHT = [
  'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1920&q=80',  // city night
  'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80',  // night sky stars
  'https://images.unsplash.com/photo-1494524693376-f4fcc78a0c02?w=1920&q=80',  // aurora
  'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=1920&q=80',  // milky way
  'https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?w=1920&q=80',  // night city lights
  'https://images.unsplash.com/photo-1559827260-dc66d52bef19?w=1920&q=80',  // Tokyo cityscape night
  'https://images.unsplash.com/photo-1470770903676-69b98201ea1c?w=1920&q=80',  // aurora lake reflection
  'https://images.unsplash.com/photo-1429552077091-836152271555?w=1920&q=80',  // snowy mountains night
  'https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?w=1920&q=80',  // mountain starry sky
];

function getWallpaperPool() {
  const h = new Date().getHours();
  return (h >= 6 && h < 20) ? WALLPAPERS_DAY : WALLPAPERS_NIGHT;
}

// ════════════════════════════════════════
// CLOCK
// ════════════════════════════════════════
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('th').textContent = h;
  document.getElementById('tm').textContent = m;
  document.getElementById('date').textContent =
    `${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
  document.getElementById('weekday').textContent = DAYS[now.getDay()];
}
setInterval(updateClock, 1000);
updateClock();

// ════════════════════════════════════════
// WEATHER  (Open-Meteo, free, no key)
// ════════════════════════════════════════
const WMO = {
  0:'Clear',1:'Mainly Clear',2:'Partly Cloudy',3:'Overcast',
  45:'Foggy',48:'Rime Fog',
  51:'Light Drizzle',53:'Drizzle',55:'Heavy Drizzle',
  61:'Light Rain',63:'Rain',65:'Heavy Rain',
  71:'Light Snow',73:'Snow',75:'Heavy Snow',77:'Snow Grains',
  80:'Light Showers',81:'Showers',82:'Heavy Showers',
  85:'Snow Showers',86:'Heavy Snow Showers',
  95:'Thunderstorm',96:'Thunderstorm+Hail',99:'Thunderstorm+Heavy Hail',
};
const WMO_ICON = {
  0:'☀️',1:'🌤️',2:'⛅',3:'☁️',
  45:'🌫️',48:'🌫️',
  51:'🌦️',53:'🌦️',55:'🌧️',
  61:'🌧️',63:'🌧️',65:'🌧️',
  71:'🌨️',73:'❄️',75:'❄️',77:'🌨️',
  80:'🌦️',81:'🌧️',82:'⛈️',
  85:'🌨️',86:'❄️',
  95:'⛈️',96:'⛈️',99:'⛈️',
};

function wmoIcon(code) { return WMO_ICON[code] || '🌡️'; }
function wmoDesc(code) { return WMO[code] || 'Unknown'; }

function drawPrecipChart(probs, startHour) {
  const chart = document.getElementById('precip-chart');
  if (!chart) return;
  const maxP = Math.max(...probs, 10); // 최소 스케일 10%
  chart.innerHTML = probs.map((p, i) => {
    const h = (startHour + i) % 24;
    const showLabel = i % 6 === 0 || i === 23;
    const label = showLabel
      ? (h === 0 ? '12a' : h === 12 ? '12p' : h < 12 ? h + 'a' : (h - 12) + 'p')
      : '';
    const alpha = 0.25 + (p / 100) * 0.75;
    const heightPct = Math.max((p / maxP) * 100, 6);
    const showVal = p >= 20;
    return `<div class="precip-bar-wrap">
      ${showVal ? `<div style="font-size:9px;color:rgba(100,181,246,0.9);margin-bottom:1px;">${p}%</div>` : ''}
      <div class="precip-bar" style="height:${heightPct}%;background:rgba(100,181,246,${alpha.toFixed(2)});"></div>
      <div class="precip-label">${label}</div>
    </div>`;
  }).join('');
}

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CFG.lat}&longitude=${CFG.lon}` +
      `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,` +
      `cloud_cover,visibility,weathercode` +
      `&hourly=precipitation_probability` +
      `&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
      `&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch` +
      `&timezone=America%2FNew_York&forecast_days=7`;
    const r = await fetch(url);
    const d = await r.json();
    const c = d.current;

    const fc2 = f => Math.round((f - 32) * 5 / 9);
    document.getElementById('weather-icon').textContent = wmoIcon(c.weathercode);
    const sm2 = 'display:block;font-size:0.6em;opacity:0.8;line-height:1.1;';
    document.getElementById('weather-temp').innerHTML = `${Math.round(c.temperature_2m)}°F<span style="${sm2}">(${fc2(c.temperature_2m)}°C)</span>`;
    document.getElementById('weather-desc').textContent = wmoDesc(c.weathercode);
    document.getElementById('weather-feels').innerHTML = `Feels like ${Math.round(c.apparent_temperature)}°F <span style="font-size:0.85em;opacity:0.8;">(${fc2(c.apparent_temperature)}°C)</span>`;
    const dd0 = d.daily;
    const sm = 'font-size:0.78em;opacity:0.8;';
    document.getElementById('weather-hi').innerHTML =
      `↑${Math.round(dd0.temperature_2m_max[0])}°F <span style="${sm}">(${fc2(dd0.temperature_2m_max[0])}°C)</span>`;
    document.getElementById('weather-lo').innerHTML =
      `↓${Math.round(dd0.temperature_2m_min[0])}°F <span style="${sm}">(${fc2(dd0.temperature_2m_min[0])}°C)</span>`;
    document.getElementById('w-hum').textContent = c.relative_humidity_2m;
    document.getElementById('w-wind').textContent = Math.round(c.wind_speed_10m);
    document.getElementById('w-vis').textContent = c.visibility ? (c.visibility / 1609).toFixed(1) : '--';
    document.getElementById('w-cloud').textContent = c.cloud_cover;

    // 24h precip chart
    const now = new Date();
    const currentHour = now.getHours();
    const precipProbs = d.hourly.precipitation_probability.slice(currentHour, currentHour + 24);
    drawPrecipChart(precipProbs, currentHour);

    // Forecast
    const fc = document.getElementById('forecast');
    fc.innerHTML = '';
    const dd = d.daily;
    for (let i = 0; i < 7; i++) {
      const date = new Date(dd.time[i] + 'T12:00:00');
      const day = DAYS[date.getDay()].slice(0,3);
      const row = document.createElement('div');
      row.className = 'fc-row';
      row.innerHTML = `
        <span class="fc-day">${day}</span>
        <span class="fc-icon">${wmoIcon(dd.weathercode[i])}</span>
        <span class="fc-hi">${Math.round(dd.temperature_2m_max[i])}°<span style="font-size:11px;font-weight:400;opacity:0.7"> (${fc2(dd.temperature_2m_max[i])}°)</span></span>
        <span class="fc-lo">${Math.round(dd.temperature_2m_min[i])}°<span style="font-size:11px;opacity:0.7"> (${fc2(dd.temperature_2m_min[i])}°)</span></span>
        <span class="fc-precip">💧<span class="fc-precip-num">${dd.precipitation_probability_max[i]}%</span></span>
      `;
      fc.appendChild(row);
    }
  } catch(e) {
    document.getElementById('weather-desc').textContent = 'Weather unavailable';
    console.error('Weather fetch failed', e);
  }
}

// ════════════════════════════════════════
// NEWS
// ════════════════════════════════════════

function relTime(dateStr) {
  if (!dateStr) return '';
  const diff = (Date.now() - new Date(dateStr)) / 60000;
  if (diff < 1) return 'Just now';
  if (diff < 60) return `${Math.round(diff)}m ago`;
  if (diff < 1440) return `${Math.round(diff/60)}h ago`;
  return `${Math.round(diff/1440)}d ago`;
}

async function fetchOneFeed(feed) {
  try {
    const r = await fetch(CFG.rss2json + encodeURIComponent(feed.url));
    const d = await r.json();
    if (d.status !== 'ok') return [];
    return (d.items || []).map(it => ({
      id: feed.id, label: feed.label, badge: feed.badge,
      title: (it.title || '').replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"').trim(),
      pubDate: it.pubDate,
    })).filter(it => it.title);
  } catch(e) { return []; }
}

let newsBySource = { bbc: [], nyt: [], yonhap: [] };
let newsIndex = { nyt: 0, yonhap: 0 };

async function fetchNews() {
  for (const feed of CFG.newsFeeds) {
    const items = await fetchOneFeed(feed);
    newsBySource[feed.id] = items.slice(0, 5);
    renderSection(feed.id);
    await new Promise(r => setTimeout(r, 1000));
  }
}

function renderSection(id) {
  const el = document.getElementById('news-' + id);
  if (!el) return;
  const items = newsBySource[id];
  if (!items.length) { el.innerHTML = '<div style="color:var(--muted);font-size:13px;">No headlines.</div>'; return; }
  const idx = newsIndex[id] !== undefined ? newsIndex[id] % items.length : 0;
  const n = items[idx];
  el.style.opacity = '0';
  setTimeout(() => {
    el.innerHTML = `<div class="news-item"><div class="news-headline">${n.title}</div></div>`;
    el.style.opacity = '1';
  }, 300);
}

function renderNews() {
  ['nyt','yonhap'].forEach(renderSection);
}

// 1분마다 다음 헤드라인으로 순환
setInterval(() => {
  ['nyt','yonhap'].forEach(id => {
    const items = newsBySource[id];
    if (!items.length) return;
    newsIndex[id] = (newsIndex[id] + 1) % items.length;
    renderSection(id);
  });
}, 60 * 1000);

// Auto-scroll each section every 10s
let newsScrollInterval;
function startNewsScroll() {
  clearInterval(newsScrollInterval);
  const lists = ['news-nyt','news-yonhap','news-bbc'];
  let i = 0;
  newsScrollInterval = setInterval(() => {
    const el = document.getElementById(lists[i % lists.length]);
    if (el) {
      const max = el.scrollHeight - el.clientHeight;
      if (el.scrollTop >= max - 10) el.scrollTo({ top: 0, behavior: 'smooth' });
      else el.scrollBy({ top: 100, behavior: 'smooth' });
    }
    i++;
  }, 10000);
}

// ════════════════════════════════════════
// WALLPAPER
// ════════════════════════════════════════
let wpIndex = 0;
const wpEl = document.getElementById('wallpaper');
const wpNext = document.getElementById('wallpaper-next');

// Preload image before swap
function preloadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = img.onerror = () => resolve();
    img.src = src;
  });
}

let currentPool = [];

function shuffled(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function changeWallpaper() {
  const pool = getWallpaperPool();
  // 시간대가 바뀌었으면 풀 교체
  if (pool !== currentPool) {
    currentPool = pool;
    wpIndex = 0;
    currentPool = shuffled(pool);
  } else {
    wpIndex = (wpIndex + 1) % currentPool.length;
  }
  const next = currentPool[wpIndex];
  await preloadImage(next);
  wpNext.style.backgroundImage = `url('${next}')`;
  wpNext.style.opacity = '1';
  setTimeout(() => {
    wpEl.style.backgroundImage = `url('${next}')`;
    wpNext.style.opacity = '0';
  }, 1600);
}

function initWallpaper() {
  currentPool = shuffled(getWallpaperPool());
  wpIndex = 0;
  wpEl.style.backgroundImage = `url('${currentPool[0]}')`;
  setInterval(changeWallpaper, CFG.wallpaperInterval);
}


// ════════════════════════════════════════
// MARKETS  (환율 + S&P500 + KOSPI)
// ════════════════════════════════════════
function setMarketChange(elId, pct) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
  el.className = 'market-change ' + (pct >= 0 ? 'up' : 'down');
}

async function fetchFX() {
  try {
    // 환율 현재값 + 전날 등락률 (Yahoo Finance)
    const yhUrl = 'https://query1.finance.yahoo.com/v8/finance/chart/USDKRW%3DX?interval=1d&range=2d';
    const proxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(yhUrl);
    const r = await fetch(proxy);
    const outer = await r.json();
    const d = JSON.parse(outer.contents);
    const meta = d.chart.result[0].meta;
    const rate = meta.regularMarketPrice;
    const prev = meta.chartPreviousClose;
    const pct  = ((rate - prev) / prev) * 100;
    const el = document.getElementById('fx-KRW');
    if (el) el.textContent = Math.round(rate).toLocaleString();
    setMarketChange('fx-KRW-chg', pct);
  } catch(e) {
    // fallback: open.er-api
    try {
      const r2 = await fetch('https://open.er-api.com/v6/latest/USD');
      const d2 = await r2.json();
      if (d2.result === 'success') {
        const el = document.getElementById('fx-KRW');
        if (el) el.textContent = Math.round(d2.rates['KRW']).toLocaleString();
      }
    } catch(e2) { console.error('FX fetch failed', e2); }
  }
}

async function fetchMarket(symbol, valueId, changeId) {
  try {
    const yhUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=2d`;
    const proxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(yhUrl);
    const r = await fetch(proxy);
    const outer = await r.json();
    const d = JSON.parse(outer.contents);
    const meta = d.chart.result[0].meta;
    const price = meta.regularMarketPrice;
    const prev  = meta.chartPreviousClose;
    const pct   = ((price - prev) / prev) * 100;
    const valEl = document.getElementById(valueId);
    if (valEl) valEl.textContent = price.toLocaleString(undefined, { maximumFractionDigits: 2 });
    setMarketChange(changeId, pct);
  } catch(e) { console.error('Market fetch failed', symbol, e); }
}

async function fetchAllMarkets() {
  await fetchFX();
  await new Promise(r => setTimeout(r, 800));
  await fetchMarket('^GSPC', 'mkt-sp500', 'mkt-sp500-chg');
  await new Promise(r => setTimeout(r, 800));
  await fetchMarket('^KS11', 'mkt-kospi', 'mkt-kospi-chg');
}

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
(async function init() {
  initWallpaper();

  await Promise.all([fetchWeather(), fetchNews(), fetchAllMarkets()]);
  startNewsScroll();

  setInterval(fetchWeather, CFG.weatherRefresh);
  setInterval(async () => { await fetchNews(); startNewsScroll(); }, CFG.newsRefresh);
  setInterval(fetchAllMarkets, 5 * 60 * 1000); // 시장 5분마다 갱신

  // Update relative times every minute
  setInterval(() => {
    if (allNews.length) renderNews();
  }, 60000);
})();
